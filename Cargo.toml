[package]
name = "obj2brs"
version = "0.1.3"
authors = ["Kmschr <Kmschr@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

include = ["reference.brs"]

[dependencies]
tobj = "4.0"
brdb = "0.5"
cgmath = "0.18"
image = "0.24"
uuid = "1.0"
chrono = "0.4"
eframe = { version = "0.28", features = ["persistence"] }
thiserror = "2.0"
dirs = "6.0"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }

# BSP to OBJ converter plugin (for Half-Life, Quake, CoD maps)
bsp_converter = { path = "plugins/bsp_converter", features = ["serde"] }

[features]
